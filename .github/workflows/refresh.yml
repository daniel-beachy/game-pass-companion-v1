name: Refresh data and deploy

on:
  schedule:
    - cron: "17 9 * * *" # daily, early morning US time
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh catalog
        if: github.event_name != 'push'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: npx tsx scripts/refresh.ts

      # Counts missing Claude notes (no Claude usage). Claude only runs below when something is missing.
      - name: Check Claude notes
        id: notes
        if: github.event_name != 'push'
        run: |
          npx tsx scripts/blurbs.ts --status
          echo "pending=$(node -p 'require("./public/data/blurbs-status.json").pending')" >> "$GITHUB_OUTPUT"

      - name: Write missing Claude notes (up to 30)
        if: github.event_name != 'push' && steps.notes.outputs.pending != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLURB_LIMIT: "30"
        run: |
          npm install -g @anthropic-ai/claude-code
          npx tsx scripts/blurbs.ts

      - name: Digest preview page
        run: npx tsx scripts/digest.ts

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data public/digest
          git diff --cached --quiet || git commit -m "Nightly data refresh"
          git pull --rebase -X theirs origin main && git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
