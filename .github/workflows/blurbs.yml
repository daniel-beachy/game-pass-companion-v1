name: Write Claude notes

# Manual run for writing notes right away. The nightly refresh also writes up to 30 missing ones.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Most notes to write this run"
        default: "200"
      check_token:
        description: "Only check the Claude token works (one tiny request, writes nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - name: Check Claude token
        if: inputs.check_token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          out=$(echo "Reply with only the word OK." | claude -p --model claude-sonnet-5-5 --max-turns 1)
          echo "Claude replied: $out"
          echo "$out" | grep -q OK
      - name: Write notes
        if: ${{ !inputs.check_token }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLURB_LIMIT: ${{ inputs.limit }}
        run: npx tsx scripts/blurbs.ts
      - name: Commit notes
        if: ${{ !inputs.check_token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Claude notes"
          git pull --rebase -X theirs origin main && git push
      - run: npm run build
        if: ${{ !inputs.check_token }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.check_token }}
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !inputs.check_token }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
